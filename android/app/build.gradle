plugins {
    id "com.android.application"
}

android {
    namespace "com.promptlab.workshop"
    compileSdk 34

    defaultConfig {
        applicationId "com.promptlab.workshop"
        minSdk 26
        targetSdk 34
        versionCode 22
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress "html", "js", "css", "json"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.8.0"
}
